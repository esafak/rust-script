name: Release

on:
  push:
    tags:
      - '[0-9]+.*'
  workflow_dispatch:

jobs:
  create-release:
    name: "Create GitHub release"
    # only publish from the origin repository
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.repository_owner == 'fornwall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  crates:
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.repository_owner == 'fornwall'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: publish package to crates
        run: |
          cargo package
          cargo publish --token ${{ secrets.CARGO_TOKEN }}

  binaries-release:
    name: "Upload release binaries"
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/') &&
      github.repository_owner == 'fornwall'
    needs:
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: universal-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rust-script
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries-test:
    name: "Build test binaries"
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-unknown-linux-gnu.2.28
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: universal-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rust-script
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build-tool }}
          archive: rust-script-${{ matrix.target }}
          tar: all
          zip: windows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rust-script-${{ matrix.target }}
          path: rust-script-${{ matrix.target }}.*
          if-no-files-found: error
